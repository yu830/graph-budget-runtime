[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graphbudget"
version = "0.1.0"
description = "Measured, frozen CUDA Graph plans for pinned SGLang decode"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[project.scripts]
graphbudget = "graphbudget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
graphbudget = ["patches/*.patch", "patches/*.json"]
